name: AUREXIS CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"


      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx2


      - name: Verify test dependencies
        working-directory: backend
        run: |
          python -m pytest --version
          python -c "import httpx2; print('httpx2 OK')"


      - name: Run backend tests
        working-directory: backend

        env:
          APP_NAME: AUREXIS API
          APP_VERSION: 1.0.0

          DEBUG: "false"

          API_V1_PREFIX: /api/v1

          FRONTEND_URL: http://localhost:3000

          DATABASE_URL: sqlite+pysqlite:///./test.db

          JWT_SECRET_KEY: ci-test-secret-key-do-not-use-in-production
          JWT_ALGORITHM: HS256

          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 7

        run: |
          python -m pytest -q


  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

          cache: npm

          cache-dependency-path:
            frontend/package-lock.json


      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci


      - name: TypeScript check
        working-directory: frontend
        run: |
          npm run typecheck


      - name: Production build
        working-directory: frontend

        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1

        run: |
          npm run build


  docker:
    name: Docker Validation
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Validate Docker Compose
        env:
          POSTGRES_DB: aurexis
          POSTGRES_USER: aurexis_user
          POSTGRES_PASSWORD: ci_database_password

          JWT_SECRET_KEY: ci-jwt-secret-key
          JWT_ALGORITHM: HS256

          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 7

        run: |
          docker compose config


      - name: Build backend image
        run: |
          docker build \
            -t aurexis-backend:ci \
            ./backend


      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=/api/v1 \
            -t aurexis-frontend:ci \
            ./frontend