name: CI

# Runs on every push to a working branch, and as Stage 1 of the
# Production pipeline (deploy.yml) after a merge into main.
on:
  push:
    branches-ignore:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # A newer push to the same branch replaces the older run; main is never cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "24"
  RUFF_VERSION: "0.14.0"

jobs:

  backend-deps:
    name: CI - Backend dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install and check dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

  backend-syntax:
    name: CI - Python syntax compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Compile every module
        working-directory: backend
        run: python -m compileall -q app alembic tests

  backend-lint:
    name: CI - Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Ruff (errors, unused imports and variables)
        working-directory: backend
        run: |
          python -m pip install "ruff==${RUFF_VERSION}"
          ruff check app tests alembic \
            --select E9,F63,F7,F82,F401,F811,F841 \
            --output-format github

  backend-tests:
    name: CI - Backend tests
    runs-on: ubuntu-latest
    needs: backend-deps
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx2
      - name: Run tests
        working-directory: backend
        env:
          APP_NAME: AUREXIS API
          APP_VERSION: 1.0.0
          DEBUG: "false"
          API_V1_PREFIX: /api/v1
          FRONTEND_URL: http://localhost:3000
          DATABASE_URL: sqlite+pysqlite:///./test.db
          JWT_SECRET_KEY: ci-test-secret-key-do-not-use-in-production
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 7
        run: python -m pytest -q

  frontend-typecheck:
    name: CI - Frontend type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck

  frontend-build:
    name: CI - Frontend build
    runs-on: ubuntu-latest
    needs: frontend-typecheck
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  compose:
    name: CI - Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate both compose files
        env:
          POSTGRES_DB: aurexis
          POSTGRES_USER: aurexis_user
          POSTGRES_PASSWORD: ci_database_password
          JWT_SECRET_KEY: ci-jwt-secret-key
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 7
          FRONTEND_URL: https://aurexis.cc
          ALLOWED_HOSTS: aurexis.cc
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q
          bash -n scripts/deploy.sh

  image-build:
    name: CI - Container build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - backend-lint
      - backend-syntax
      - frontend-build
      - compose
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - frontend
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
