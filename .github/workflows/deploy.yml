name: AXION CD

on:
  workflow_run:
    workflows:
      - AXION CI
    types:
      - completed

  workflow_dispatch:


permissions:
  contents: read
  packages: write


env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/axion-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/axion-frontend


jobs:

  publish:
    name: Publish Production Images
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Prepare lowercase image names
        shell: bash
        run: |
          echo "BACKEND_IMAGE=$(echo '${{ env.BACKEND_IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=$(echo '${{ env.FRONTEND_IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"


      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true

          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.title=AXION Backend
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}


      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true

          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1

          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

          labels: |
            org.opencontainers.image.title=AXION Frontend
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}


      - name: Delivery summary
        shell: bash
        run: |
          echo "AXION delivery completed."
          echo ""
          echo "Backend:"
          echo "${BACKEND_IMAGE}:latest"
          echo ""
          echo "Frontend:"
          echo "${FRONTEND_IMAGE}:latest"