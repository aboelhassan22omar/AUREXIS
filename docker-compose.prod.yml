services:

  postgres:
    image: postgres:18
    container_name: axion-prod-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - axion_prod_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - axion-prod-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: axion-backend:prod
    container_name: axion-prod-backend

    restart: unless-stopped

    environment:
      APP_NAME: AXION API
      APP_VERSION: 1.0.0

      DEBUG: "false"

      API_V1_PREFIX: /api/v1

      FRONTEND_URL: ${FRONTEND_URL}

      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}

      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}

    command:
      - sh
      - -c
      - |
        alembic upgrade head &&
        uvicorn app.main:app \
          --host 0.0.0.0 \
          --port 8000 \
          --workers 2

    depends_on:
      postgres:
        condition: service_healthy

    expose:
      - "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - axion-prod-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1

    image: axion-frontend:prod
    container_name: axion-prod-frontend

    restart: unless-stopped

    environment:
      NODE_ENV: production

    depends_on:
      backend:
        condition: service_healthy

    expose:
      - "3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - axion-prod-network


  nginx:
    image: nginx:1.27-alpine
    container_name: axion-prod-nginx

    restart: unless-stopped

    depends_on:
      frontend:
        condition: service_healthy

      backend:
        condition: service_healthy

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1/ || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

    networks:
      - axion-prod-network


volumes:
  axion_prod_postgres_data:
    name: axion-prod-postgres-data


networks:
  axion-prod-network:
    name: axion-prod-network
    driver: bridge