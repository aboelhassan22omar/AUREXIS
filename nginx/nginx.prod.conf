server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name aurexis.duckdns.org;

    server_tokens off;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://aurexis.duckdns.org$request_uri;
    }
}


server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name aurexis.duckdns.org;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/aurexis.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aurexis.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10M;

    add_header Strict-Transport-Security
        "max-age=31536000; includeSubDomains"
        always;

    add_header X-Content-Type-Options
        "nosniff"
        always;

    add_header X-Frame-Options
        "SAMEORIGIN"
        always;

    add_header Referrer-Policy
        "strict-origin-when-cross-origin"
        always;

    add_header Permissions-Policy
        "camera=(), microphone=(), geolocation=()"
        always;

    add_header Cross-Origin-Opener-Policy
        "same-origin"
        always;


    location /api/v1/chat/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }


    location /api/ {
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    location /_next/static/ {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 30d;

        add_header Cache-Control
            "public, immutable";

        add_header X-Content-Type-Options
            "nosniff"
            always;
    }


    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}